# LLM hyperparameters
agent_name: "grow_prompt"
mode: "only_incorrect"
seed: 43
llm:
  series: "openai"  # ["anthropic", "gemini_dev"]
  model_name: "qwen-plus"  # ["claude-3-haiku-20240307", "gemini-1.0-pro-001"]
  temperature: 0.0
  max_tokens: 1536
# Other configs
top_k: 16  # keep the <top_k> most recent instances in the grow-prompt scratchpad
